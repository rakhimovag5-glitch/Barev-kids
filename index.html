/* Purple-gold illustrated storybook theme — interactive HTML, not screenshots */
body{background:#3d167e}
#app{background:radial-gradient(ellipse at 48% 6%,#b27aff 0%,transparent 31%),radial-gradient(ellipse at 88% 55%,#ad6aff55 0%,transparent 35%),linear-gradient(180deg,#5521a0 0%,#7e43c5 32%,#9d6be4 62%,#5634b2 100%);color:#722c65}
#app:before{content:'✨   ⭐   ✨   ⭐';font-size:26px;top:100px;opacity:.85;color:#ffda69}
.logo{color:#ef518d;text-shadow:-2px -2px white,2px 2px white,0 5px #ffd95c,0 9px #7b2079}
.logo b{color:#4f85ed}.counter{background:linear-gradient(#fffbd8,#ffda7f);box-shadow:0 5px #c48b22}
.panel{background:linear-gradient(155deg,#fffdf0 0%,#ffeaba 76%,#ffcbdc 100%);border-color:#fffaf6;box-shadow:0 8px #d6a24e,0 15px 30px #20055b66}
.panel.blue{background:linear-gradient(135deg,#fef3ff,#c3eaff);box-shadow:0 8px #b86cbb,0 12px 22px #26055d55}
.panel.pink{background:linear-gradient(135deg,#fff1f8,#f9cde7)}
.panel.purple{background:linear-gradient(125deg,#f8dbff,#d49af4 45%,#b88ae8);box-shadow:0 8px #7b3caf,0 13px 23px #2a085966}
.wordcard{background:linear-gradient(135deg,#fffcf0,#fff0bb);border-color:#fffbef;box-shadow:0 6px #f0c257,0 11px 15px #3f176a44}
.wordcard:nth-child(4n+2){background:linear-gradient(#fff5fd,#ffd0e9)}
.wordcard:nth-child(4n+3){background:linear-gradient(#eefaff,#c9e8ff)}
.wordcard:nth-child(4n){background:linear-gradient(#f3ffe6,#cdf5c1)}
.wordcard img{background:radial-gradient(circle,#fffefa 0,#fff1c6 100%);border:2px solid #ffe6a3}
.bigbtn{border-color:#fff9e5;background:linear-gradient(180deg,#fff78c 0%,#ffce2d 54%,#f2a619 100%);box-shadow:0 7px #d48d1c,0 12px 20px #27094c66}
.bigbtn.green{background:linear-gradient(#d5ff89,#79ed37 40%,#35c30c);box-shadow:0 7px #27971e,0 12px 20px #27094c66}
.bigbtn.blue{background:linear-gradient(#9beaff,#32b0f7 62%,#2086de);box-shadow:0 7px #1c79a8}
.nava{background:#fffae8;border-color:#ffdc8b;box-shadow:0 -5px 24px #31095a66}
.rewardgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.reward-card{background:linear-gradient(150deg,#fffbed,#ffe7a4);border:4px solid #fffefa;box-shadow:0 5px #e0ab44,0 8px 18px #4b14755c}
.reward-card img{height:145px;max-width:100%}
.reward-card.locked{background:linear-gradient(#eee8f3,#d6cce3)}
.screen-overlay{background:radial-gradient(ellipse at center,#8e3cde 0%,#50148c 48%,#250345 100%)}
.reward-pop{background:radial-gradient(ellipse at 50% 10%,#fffcea 0%,#ffe6a7 48%,#ffbfdc 100%);box-shadow:0 0 50px #ffdb87ab;border-color:#fff8df}
.reward-pop h2{color:#8d1c65}
.chest{transform:scale(1.06)}
.answer{background:linear-gradient(#fff9e6,#ffd9f0)}
.answer.correct{background:linear-gradient(#d7ffd6,#96edab)}
.answer.wrong{background:linear-gradient(#ffe4e1,#ffa7b9)}
@media(max-width:360px){.reward-card img{height:118px}}

/* Dedicated alphabet and stable writing board */
.trace-wrap{height:315px;position:relative;isolation:isolate;margin:15px 0;border:5px solid #d4acec;border-radius:25px;overflow:hidden;background:repeating-linear-gradient(to bottom,#fffdfb 0px,#fffdfb 76px,#ebdcef 77px,#fffdfb 78px)}
.trace-guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(140px,44vw,204px);font-weight:850;color:#e8cde9;line-height:1;pointer-events:none;user-select:none;z-index:1}
.trace-wrap canvas{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;border-radius:0;z-index:2;touch-action:none}
.alphabet-example{background:linear-gradient(150deg,#fff9e2,#ffdeaa);border:5px solid #fff;border-radius:28px;min-height:240px;margin:12px 0;padding:16px;display:flex;align-items:center;justify-content:center;gap:7px;flex-direction:column;text-align:center;box-shadow:0 7px #ddb064}
.alphabet-example img{width:165px;height:145px;object-fit:contain}
.alphabet-emoji{font-size:105px;line-height:1.3}
.alphabet-example .hy{font-size:29px;color:#af2c66}
.alphabet-example .ru{font-size:22px}

/* Иллюстрации из утверждённого комплекта — объемные, не схематичные */
.wordcard img{width:100%;height:160px;object-fit:contain;object-position:center;background:radial-gradient(circle at 50% 48%,#fffef3 4%,#ffedc5 100%);padding:6px;border:2px solid #f9d993;border-radius:22px;filter:drop-shadow(0 8px 5px #79365721)}
.wordlarge>img{width:min(100%,330px);height:260px;object-fit:contain;margin:8px auto;display:block;filter:drop-shadow(0 8px 10px #5b208545)}
.guide img{object-fit:contain!important;object-position:center bottom;background:linear-gradient(140deg,#e5b5ff,#ffe8ac);border-radius:20px}
.hero-option img{object-fit:contain!important;object-position:center bottom;background:linear-gradient(155deg,#f9e4ff,#ffe4be)}
.bighero{max-height:340px;object-fit:contain!important;filter:drop-shadow(0 9px 9px #6b258a33)}
.reward-card img{width:100%;height:130px;object-fit:contain;filter:drop-shadow(0 7px 5px #6a264230)}
.reward-card.locked img{filter:grayscale(1) brightness(.8);opacity:.42}
.revealimg{width:min(85%,310px)!important;height:260px!important;object-fit:contain;filter:drop-shadow(0 0 18px #ffcd45)}
.real-chest{display:block;width:min(100%,360px);height:240px;object-fit:contain;margin:5px auto 16px;filter:drop-shadow(0 12px 25px #ad427c77);animation:chestFloat 2.2s ease-in-out infinite}
.real-chest-open{animation:chestReveal .7s ease-out both}
@keyframes chestFloat{50%{transform:translateY(-7px) scale(1.02)}}
@keyframes chestReveal{0%{opacity:0;transform:translateY(14px) scale(.87)}100%{opacity:1;transform:translateY(0) scale(1)}}
.alphabet-example img{width:200px;height:170px;object-fit:contain}
@media(max-width:400px){.wordcard img{height:125px}.reward-card img{height:115px}}

/* Upgraded violet & gold illustrated alphabet */
#app{box-shadow:0 0 0 2px #efc6ff55,0 0 70px #1b043c55}
.panel{border-color:#fff7e7;box-shadow:0 7px #e9b34a,0 15px 25px #240c4a33}
.alphabet-example{background:radial-gradient(circle at 50% 25%,#fffefa,#fff1c3 76%);border:4px solid #ffdb78;box-shadow:0 0 0 4px #ffffff,0 9px #c99141;min-height:260px}
.alphabet-example img{width:min(90%,280px);height:205px;object-fit:contain;filter:drop-shadow(0 9px 7px #7543903b)}
.alphabet-example .hy{font-size:34px}
.alphabet-example .ru{font-size:23px}
.letter{box-shadow:0 4px #c08b3a;border-color:#fff9e9;transition:transform .12s}
.letter:active,.wordcard:active,.topic:active{transform:scale(.97)}
.wordcard img{background:radial-gradient(circle at 50% 42%,#fffdfa 5%,#ffe3b7 100%)}
.guide{background:linear-gradient(115deg,#fffaf0,#f8dbff);border-color:#ffefcf}
.guide img{object-fit:contain;background:radial-gradient(circle,#f9e1ff,#ffe8bf)}
.logo{color:#c42773}.logo b{color:#7931c7}
@media(min-width:600px){#app{border-radius:28px;margin:16px auto}}

/* Clear readable picture cards on small iPhone screens */
.wordcard img {background:radial-gradient(circle,#fffef9,#fce7c9);border-radius:20px;object-fit:contain}
.wordlarge>img {max-height:300px}
.alphabet-example img {max-width:100%;height:220px}
@media (max-width:380px) {.alphabet-example img{height:185px}}

/* Mobile-screen adjustments — November 2026 */
html,body{max-width:100%;overflow-x:hidden}
#app{width:100%;padding-bottom:calc(114px + env(safe-area-inset-bottom,0px))}
.top{gap:8px}.logo{min-width:0;font-size:clamp(21px,6.1vw,28px);white-space:nowrap}.counter{flex-shrink:0;padding:7px 10px;font-size:clamp(15px,4vw,19px)}
.guide{min-height:0}.guide img{width:76px;height:91px;object-fit:contain;background:#ffe9d9}.guide strong{font-size:clamp(16px,4.4vw,20px)}
.panel{padding:14px;margin-bottom:16px}.alphabet-example{min-height:0;padding:12px;margin:10px 0}.alphabet-example img{width:100%;max-width:225px;height:175px;object-fit:contain}
.nava{padding:7px 4px calc(7px + env(safe-area-inset-bottom,0px));min-height:68px}.nava button{min-width:0;flex:1;font-size:11px}.nava span{font-size:23px}
@media(max-width:360px){.logo{font-size:20px}.counter{padding:6px}.guide img{width:65px;height:81px}.guide strong{font-size:15px}.alphabet{grid-template-columns:repeat(5,minmax(0,1fr))}}

/* Letter screens: designed to fit the entire activity between browser chrome and bottom navigation */

#app:has(.letter-screen) .top{margin:0 0 9px}
.letter-screen{padding:12px 12px 13px!important;margin:0!important;border-radius:29px}
.letter-topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.letter-topline .back{margin:0;padding:8px 12px;font-size:14px;border-radius:15px}
.letter-count{font-size:17px;font-weight:1000;color:#87336c;white-space:nowrap}
.letter-content{display:flex;flex-direction:column;align-items:center;gap:4px}
.letter-glyph{font-size:clamp(60px,15vw,83px);line-height:1.12;font-weight:900;color:#c82766;text-align:center;min-height:68px}
.letter-screen .alphabet-example{width:100%;margin:0!important;padding:7px 9px 9px!important;gap:2px!important;border-width:3px;box-shadow:0 0 0 3px white,0 5px #c99141;border-radius:23px;min-height:0!important}
.letter-screen .alphabet-example img{display:block;height:clamp(92px,21dvh,145px);width:100%;max-width:230px;object-fit:contain;filter:drop-shadow(0 3px 3px #75439028)}
.letter-screen .alphabet-example .hy{font-size:clamp(20px,5.4vw,26px);line-height:1.2}
.letter-screen .alphabet-example .ru{font-size:clamp(15px,4vw,19px);line-height:1.2}
.letter-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.letter-actions .bigbtn{width:100%;margin:0;min-height:49px;padding:7px 3px;border-width:3px;border-radius:17px;font-size:clamp(13px,3.9vw,17px);box-shadow:0 4px #b88649;text-shadow:none}
.letter-actions .bigbtn.green{color:#23651f}.letter-actions .bigbtn.blue{color:#075c90}

const KEY='barev-kids-vibrant-2026';

const topics=()=>`${guide('Выбирай яркую тему и смотри картинки!')}<section class="panel"><div class="heading">Мои 10 уроков 📚</div><div class="topics">${LESSONS.map((l,i)=>`<button class="topic" data-do="topic" data-i="${i}"><em>${l[1]}</em><span>${i+1}. ${l[0]}<small>${l[2].length} карточек ${state.completed.includes(i)?' · ✅ пройдено':''}</small></span></button>`).join('')}</div></section>`;
const gallery=()=>{const l=LESSONS[state.lesson];return `<section class="panel"><button class="back" data-do="topics">← К темам</button><div class="heading">${l[1]} ${l[0]}</div><div class="gallery">${l[2].map((w,i)=>`<button class="wordcard" data-do="card" data-i="${i}">${wordImage(w)}<span class="ru">${h(w[1])}</span><span class="hy" lang="hy">${h(w[0])}</span></button>`).join('')}</div><button class="bigbtn green" data-do="startlesson">▶ Начать урок</button></section>`};
const wordPage=()=>{const l=LESSONS[state.lesson],w=l[2][state.word];return `<section class="panel wordlarge word-screen"><button class="back" data-do="gallery">← Все карточки</button><div class="small center">Карточка ${state.word+1} из ${l[2].length}</div><div class="progress">${l[2].map((_,i)=>`<div class="dot ${i<=state.word?'active':''}"></div>`).join('')}</div>${wordImage(w)}<div class="center"><div class="hy" lang="hy">${h(w[0])}</div><div class="pr">${h(w[2])}</div><h2>${h(w[1])}</h2></div><button class="bigbtn green" data-do="nextword">${state.word===l[2].length-1?'✅ Проверим, что запомнили':'Дальше →'}</button></section>`};
const quizChoices=()=>{const l=LESSONS[state.lesson],arr=l[2],n=state.quiz;let indexes=[n];for(let o=1;o<arr.length&&indexes.length<4;o++)indexes.push((n+o)%arr.length);return indexes.sort((a,b)=>((a*7+n*3)%11)-((b*7+n*3)%11))};
const quizPage=()=>{const l=LESSONS[state.lesson],w=l[2][state.quiz],opts=quizChoices();return `${guide('Посмотри на слово и выбери правильный перевод.')}<section class="panel"><div class="small center">Вопрос ${state.quiz+1} из ${l[2].length}</div><div class="heading">Что означает это слово?</div><div class="hy center" lang="hy" style="font-size:31px;margin:20px 0">${h(w[0])}</div><div class="answergrid">${opts.map(i=>`<button class="answer ${state.selected===i?(i===state.quiz?'correct':'wrong'):''}" data-do="answer" data-i="${i}">${h(l[2][i][1])}</button>`).join('')}</div>${state.wrong?'<div class="feedback bad">💛 Неправильно. Попробуй ещё раз!</div>':''}${state.selected===state.quiz?`<div class="feedback">🎉 Правильно! Молодец! +5 ⭐</div><button class="bigbtn green" data-do="nextquiz">${state.quiz===l[2].length-1?'🎁 Получить награду':'Следующее слово →'}</button>`:''}</section>`};
const alphabetPage=()=>`${guide('Смотри букву, картинку и новое слово!')}<section class="panel"><div class="heading">Армянский алфавит 🔤</div><div class="small center" style="margin-bottom:14px">Выбери букву, чтобы увидеть её крупно. Письмо — отдельно. Все 39 букв с красивыми иллюстрациями. Нажми на букву, чтобы узнать новое слово.</div><div class="alphabet">${LETTERS.map((x,i)=>`<button class="letter" data-do="letter" data-i="${i}">${x}${state.lettersDone.includes(i)?'<small style="display:block;font-size:10px">✓</small>':''}</button>`).join('')}</div></section>`;
const letterDetail=()=>{const x=LETTERS[state.letter],ex=ALPHABET_EXAMPLES[state.letter];return `<section class="panel letter-screen"><div class="letter-topline"><button class="back" data-do="alphabet">← Все буквы</button><span class="letter-count">${state.letter+1} / 39</span></div><div class="letter-content"><div class="letter-glyph" lang="hy">${x}</div>${ex?`<div class="alphabet-example"><img src="${ex[2]}" alt="${h(ex[1])}" onerror="this.onerror=null;this.style.display='none';this.insertAdjacentHTML('afterend','<div class=&quot;alphabet-emoji&quot;>🌟</div>')"><div class="letter-words"><div class="hy" lang="hy">${h(ex[0])}</div><div class="ru">${ex[1]}</div></div></div>`:`<div class="alphabet-example"><div class="alphabet-emoji">🔤</div><div class="small">Изучаем форму буквы</div></div>`}</div><div class="letter-actions"><button class="bigbtn blue" data-do="write">✏️ Написать</button><button class="bigbtn green" data-do="nextalphabet">Дальше →</button></div></section>`};
const writePage=()=>{const letter=LETTERS[state.letter];return `<section class="panel write-screen"><button class="back" data-do="letter" data-i="${state.letter}">← К букве</button><div class="heading">Тренируем письмо ✏️</div><div class="center"><span lang="hy" style="font-size:67px;color:#d32962;font-weight:1000">${letter}</span><div class="small">${state.letter+1} из 39</div></div><div class="trace-wrap"><div class="trace-guide" lang="hy">${letter}</div><canvas id="draw" aria-label="Поле для письма"></canvas></div><div class="subnav"><button class="bigbtn blue" data-do="clear">↩ Очистить</button><button class="bigbtn green" data-do="nextletter">✓ Готово →</button></div><div class="small center">Тренировка свободного письма без автоматической оценки. Рисунок всегда остаётся внутри рамки.</div></section>`};
const rewardsPage=()=>`${guide('Собирай сокровища Армении!')}<section class="panel purple"><div class="heading">🏆 Моя коллекция</div><div class="center" style="font-size:20px;margin-bottom:15px">Собрано: ${state.rewards.length} из 10</div><div class="rewardgrid">${PRIZES.map((p,i)=>`<div class="reward-card ${state.rewards.includes(i)?'opened':'locked'}"><img src="assets/prizes/${p[1]}" alt="${h(p[0])}"><div>${h(p[0])}</div><small>${state.rewards.includes(i)?'✅ Получено':'🔒 Закрыто'}</small></div>`).join('')}</div></section>`;
function completion(){const idx=state.lesson,first=!state.completed.includes(idx);if(first){state.completed.push(idx);state.stars+=20}persist();state.overlay={lesson:idx,first};state.rewardStage=state.rewards.includes(idx)?'already':'closed';render()}
const rewardModal=()=>{const idx=state.overlay.lesson,p=PRIZES[idx],step=state.rewardStage;return `<div class="screen-overlay" role="dialog" aria-modal="true" aria-label="Награда за урок"><div class="reward-pop">${step==='closed'?`<div class="sparkles">✨⭐✨</div><h2>Ура! Тема пройдена!</h2><p>Ты изучил тему «${LESSONS[idx][0]}»!</p><h3>⭐ +20 звёзд</h3><img class="real-chest" src="assets/chest/closed.webp" alt="Закрытый сундук"><button class="bigbtn" data-do="openchest">🎁 Открыть сундук</button>`:step==='open'?`<div class="sparkles">✨🌟✨</div><h2>Сундук открывается!</h2><img class="real-chest real-chest-open" src="assets/chest/open.webp" alt="Открытый сундук"><button class="bigbtn" data-do="reveal">Посмотреть подарок →</button>`:`<div class="sparkles">✨🎊✨</div><h2>${step==='already'?'Подарок уже в коллекции!':'Новая награда!'}</h2><img class="revealimg" src="assets/prizes/${p[1]}" alt="${h(p[0])}"><h2>${h(p[0])}</h2><div class="reward-note">${step==='already'?'Можно снова пройти урок для повторения.':'Сокровище Армении!'}</div><button class="bigbtn green" data-do="collect">🏆 ${step==='already'?'К моим наградам':'В мою коллекцию'}</button><button class="bigbtn blue" data-do="continue">Продолжить обучение</button>`}</div></div>`};

function barevInlineImages(markup){return markup;}
function render(){let contents='';switch(state.screen){case 'choose':contents=choose();break;case 'home':contents=home();break;case 'topics':contents=topics();break;case 'gallery':contents=gallery();break;case 'word':contents=wordPage();break;case 'quiz':contents=quizPage();break;case 'alphabet':contents=alphabetPage();break;case 'letterdetail':contents=letterDetail();break;case 'write':contents=writePage();break;case 'rewards':contents=rewardsPage();break;default:contents=home();}const root=document.getElementById('app');root.classList.toggle('focus-letter',state.screen==='letterdetail');root.classList.toggle('focus-write',state.screen==='write');root.classList.toggle('focus-gallery',state.screen==='gallery');root.classList.toggle('focus-word',state.screen==='word');root.classList.toggle('focus-home',state.screen==='home');root.classList.toggle('focus-quiz',state.screen==='quiz');root.innerHTML=barevInlineImages(renderTop()+contents+nav()+(state.overlay?rewardModal():''));if(state.screen==='write')initCanvas()}
function initCanvas(){const c=document.getElementById('draw');if(!c)return;
const width=c.clientWidth,height=c.clientHeight,scale=Math.min(window.devicePixelRatio||1,3);
c.width=Math.round(width*scale);c.height=Math.round(height*scale);
const ctx=c.getContext('2d');ctx.scale(scale,scale);
ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#e74283';
let active=null;
const at=e=>{const r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(width,e.clientX-r.left)),y:Math.max(0,Math.min(height,e.clientY-r.top))}};
c.onpointerdown=e=>{e.preventDefault();if(active!==null)return;active=e.pointerId;c.setPointerCapture(e.pointerId);const p=at(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+0.01,p.y+0.01);ctx.stroke()};
c.onpointermove=e=>{if(active!==e.pointerId)return;e.preventDefault();const p=at(e);ctx.lineTo(p.x,p.y);ctx.stroke()};
const stop=e=>{if(active===e.pointerId){active=null;ctx.closePath()}};
c.onpointerup=stop;c.onpointercancel=stop;
}
document.addEventListener('click',event=>{const el=event.target.closest('[data-do]');if(!el)return;const action=el.dataset.do,i=Number(el.dataset.i);switch(action){case 'hero':state.hero=el.dataset.hero;persist();render();break;case 'choose':go('choose');break;case 'home':go('home');break;case 'topics':go('topics');break;case 'alphabet':go('alphabet');break;case 'rewards':go('rewards');break;case 'topic':state.lesson=i;go('gallery');break;case 'gallery':go('gallery');break;case 'card':state.word=i;go('word');break;case 'startlesson':state.word=0;state.quiz=0;go('word');break;case 'nextword':if(state.word<LESSONS[state.lesson][2].length-1){state.word++;render();scrollToTop()}else{state.quiz=0;state.selected=-1;go('quiz')}break;case 'answer':if(state.selected===state.quiz)return;if(i===state.quiz){state.selected=i;state.wrong=false;const questionKey=state.lesson+':'+state.quiz;if(!state.reviewed.includes(questionKey)){state.reviewed.push(questionKey);state.stars+=5}persist()}else{state.selected=-1;state.wrong=true}render();break;case 'nextquiz':if(state.quiz>=LESSONS[state.lesson][2].length-1){completion()}else{state.quiz++;state.wrong=false;state.selected=-1;render();scrollToTop()}break;case 'letter':state.letter=i;go('letterdetail');break;case 'nextalphabet':state.letter=(state.letter+1)%LETTERS.length;go('letterdetail');break;case 'write':go('write');break;case 'clear':{const c=document.getElementById('draw');if(c){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height)}break;}case 'nextletter':if(!state.lettersDone.includes(state.letter)){state.lettersDone.push(state.letter);persist()}if(state.letter<LETTERS.length-1){state.letter++;render();scrollToTop()}else go('alphabet');break;case 'openchest':state.rewardStage='open';render();break;case 'reveal':state.rewardStage='reveal';render();break;case 'collect':if(!state.rewards.includes(state.overlay.lesson)){state.rewards.push(state.overlay.lesson);persist()}state.overlay=null;go('rewards');break;case 'continue':if(!state.rewards.includes(state.overlay.lesson)){state.rewards.push(state.overlay.lesson);persist()}state.overlay=null;go('topics');break;}});
try{render()}catch(e){document.getElementById("app").innerHTML="<div style='background:#fff;border-radius:25px;padding:25px;margin:30px 10px;color:#74305e'><h2>Барев Kids</h2><p>Не удалось открыть экран. Обновите страницу.</p></div>";console.error(e)}</script></body></html>
